[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "py2ver"
version = "0.1.0"
description = "Turn Python functions into Verilog and check them against Python in simulation, on an FPGA board, and in synthesis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kirill Maslov" }]
dependencies = [
    "cocotb>=2.0,<3",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
# Talking to a physical DE0-Nano board over its UART
hw = ["pyserial>=3.5"]
# Designs written with numpy arrays
numpy = ["numpy>=1.22"]
# PyTorch models and training loops (torchvision: the MNIST examples' data)
torch = ["numpy>=1.22", "torch>=2.0", "torchvision>=0.15"]
test = ["pytest>=8", "pytest-xdist>=3", "hypothesis>=6", "pyserial>=3.5", "numpy>=1.22",
        "scikit-learn>=1.0"]

[project.urls]
Homepage = "https://github.com/maslovk/py2ver"

[tool.setuptools]
packages = ["py2ver"]

[tool.setuptools.package-data]
py2ver = [
    "templates/*.txt",
    "templates/hw/*.txt",
    "templates/hw/uart/*.txt",
    "templates/hw/syn/*.txt",
    "templates/hw/sdram/*.v",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: end-to-end simulator integration tests (cocotb + Icarus)",
    "board: the virtual DE0-Nano board (UART-level simulation of the whole project; slow)",
    "quartus: real Quartus compile (skipped unless QUARTUS_DIR is set or quartus_sh is on PATH)",
    "slow: a large design's simulation or a Quartus compile (a minute or more)",
    "long: minutes each: skipped unless pytest runs with --long",
    "hardware: on a DE0-Nano plugged in (programs it): skipped unless pytest runs with --hardware",
]
